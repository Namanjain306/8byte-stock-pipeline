version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # ---- Application-level env vars used inside the DAG / scripts ----
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
    STOCK_SYMBOLS: ${STOCK_SYMBOLS:-IBM,AAPL,MSFT}
    STOCK_DB_HOST: postgres-stock
    STOCK_DB_PORT: 5432
    STOCK_DB_NAME: ${STOCK_DB_NAME:-stockdata}
    STOCK_DB_USER: ${STOCK_DB_USER:-stockuser}
    STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:-stockpass}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-stock:
      condition: service_healthy

services:
  # ---------------------------------------------------------------
  # 1) Postgres used internally by Airflow to store DAG metadata
  # ---------------------------------------------------------------
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------
  # 2) Postgres that holds the actual stock market data (the table
  #    our pipeline updates every run)
  # ---------------------------------------------------------------
  postgres-stock:
    image: postgres:15
    container_name: postgres-stock
    environment:
      POSTGRES_USER: ${STOCK_DB_USER:-stockuser}
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD:-stockpass}
      POSTGRES_DB: ${STOCK_DB_NAME:-stockdata}
    ports:
      - "5433:5432"   # exposed on host so you can inspect data with a SQL client
    volumes:
      - postgres-stock-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d   # auto-creates the table on first boot
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${STOCK_DB_USER:-stockuser}"]
      interval: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------
  # 3) One-off container: initializes Airflow's DB + creates admin user
  # ---------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

  # ---------------------------------------------------------------
  # 4) Airflow webserver (UI at http://localhost:8080)
  # ---------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ---------------------------------------------------------------
  # 5) Airflow scheduler - actually triggers the DAG on schedule
  # ---------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      - airflow-init
    restart: always

volumes:
  postgres-airflow-data:
  postgres-stock-data:
